<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado Otorrino I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: uma coluna estreita tipo caderno de prova; cabeçalho fixo com placar, questão, gabarito comentado abaixo */
:root{
  --bg:#eef2f3; --paper:#ffffff; --ink:#18262c; --muted:#5b6d74; --line:#d3dcdf;
  --accent:#1d6378; --accent-soft:#e0eef2;
  --ok:#1f7a4a; --ok-soft:#e3f3ea; --bad:#b33a2e; --bad-soft:#fae7e4; --tip:#8a5a00; --tip-soft:#fbf1dc;
  --f-q:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --paper:#172226; --ink:#e3ecee; --muted:#93a6ac; --line:#2a3a3f;
  --accent:#6cbfd6; --accent-soft:#1b3a44;
  --ok:#5fcf8e; --ok-soft:#173527; --bad:#f08a7e; --bad-soft:#3d1f1b; --tip:#e9bb5c; --tip-soft:#3a2d12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --paper:#172226; --ink:#e3ecee; --muted:#93a6ac; --line:#2a3a3f;
  --accent:#6cbfd6; --accent-soft:#1b3a44;
  --ok:#5fcf8e; --ok-soft:#173527; --bad:#f08a7e; --bad-soft:#3d1f1b; --tip:#e9bb5c; --tip-soft:#3a2d12;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{font-family:var(--f-q);font-weight:600;font-size:1.05rem;margin-right:auto}
.brand small{font-family:var(--f-ui);font-weight:400;color:var(--muted);font-size:.8rem;margin-left:6px}
.score{display:flex;gap:12px;font-variant-numeric:tabular-nums;font-size:.9rem}
.score b{font-weight:700}
.s-ok{color:var(--ok)} .s-bad{color:var(--bad)} .s-pct{color:var(--muted)}
.bar{height:4px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

main{max-width:760px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:16px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.meta .mode{letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;font-weight:700;color:var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px 20px}
.enun{font-family:var(--f-q);font-size:1.12rem;line-height:1.55;margin:0 0 18px;text-wrap:pretty}
.alts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.alt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.alt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.alt[disabled]{cursor:default}
.alt .lt{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;border:1.5px solid var(--line);color:var(--muted)}
.alt .tx{min-width:0;padding-top:2px}
.alt.ok{border-color:var(--ok);background:var(--ok-soft)}
.alt.ok .lt{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.alt.bad{border-color:var(--bad);background:var(--bad-soft)}
.alt.bad .lt{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.alt.dim{opacity:.62}

.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.verdict .v{font-weight:700;font-size:1.05rem}
.verdict .v.ok{color:var(--ok)} .verdict .v.bad{color:var(--bad)}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:.92rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:default}

.just{display:grid;gap:10px;margin-top:14px}
.j{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;border-radius:8px;background:var(--bg);font-size:.95rem}
.j .lt{font-weight:700;color:var(--muted)}
.j.ok{background:var(--ok-soft)} .j.ok .lt{color:var(--ok)}
.j .tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:2px}
.j.ok .tag{color:var(--ok)} .j.no .tag{color:var(--bad)}
.j p{margin:0;min-width:0}
.tip{background:var(--tip-soft);border-radius:8px;padding:12px 14px;font-size:.95rem}
.tip b{color:var(--tip);display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}

.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:.85rem}
.tools .btn{font-weight:400;font-size:.85rem;padding:6px 12px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:.9rem}
.hint{color:var(--muted);font-size:.8rem;text-align:center}

.end h2{font-family:var(--f-q);font-weight:600;font-size:1.6rem;margin:0 0 4px}
.big{font-family:var(--f-q);font-size:3rem;font-weight:600;line-height:1;margin:12px 0;font-variant-numeric:tabular-nums}
.rows{display:grid;gap:8px;margin:16px 0}
.row{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;font-size:.92rem;font-variant-numeric:tabular-nums}
.row .track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.row .track i{display:block;height:100%;background:var(--accent)}
.row span:last-child{text-align:right;color:var(--muted)}
.empty{color:var(--muted)}
@media (max-width:480px){.card{padding:18px 14px}.enun{font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">Simulado Otorrino I <small>Boca · Faringe · Laringe</small></div>
    <div class="score" aria-live="polite">
      <span class="s-ok"><b id="nOk">0</b> certas</span>
      <span class="s-bad"><b id="nBad">0</b> erradas</span>
      <span class="s-pct" id="pct">0%</span>
    </div>
  </div>
  <div class="bar"><i id="barFill"></i></div>
</header>

<main id="app"></main>

<script>window.QUESTOES = [];</script>
<script src="q-boca.js" charset="utf-8"></script>
<script src="q-faringe.js" charset="utf-8"></script>
<script src="q-laringe.js" charset="utf-8"></script>
<script src="ordem-pdf.js" charset="utf-8"></script>
<script>
(function(){
  var KEY = "simulado-otorrino-1-pdf";
  var LETRAS = ["A","B","C","D","E"];
  var BANK = {};
  window.QUESTOES.forEach(function(q){ BANK[q.id] = q; });
  // Ordem fixa do PDF: questões e alternativas na mesma sequência do PDF e do gabarito
  var PDF_PERM = {}, PDF_NUM = {}, PDF_ORDER = [];
  (window.ORDEM_PDF || []).forEach(function(r, i){ if (BANK[r[0]]){ PDF_ORDER.push(r[0]); PDF_PERM[r[0]] = r[1]; PDF_NUM[r[0]] = i+1; } });
  Object.keys(BANK).forEach(function(id){ if (!PDF_PERM[id]){ PDF_ORDER.push(id); PDF_PERM[id] = [0,1,2,3,4]; } });
  var ALL = PDF_ORDER;
  var app = document.getElementById("app");
  var S = null;           // estado
  var openJust = false;   // painel de justificativas aberto na questão atual
  var pendingReset = null;

  function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function load(){ try { var s = JSON.parse(localStorage.getItem(KEY)); return s && s.order ? s : null; } catch(e){ return null; } }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function novo(ids, mode){
    var perm = {}, keep = {};
    ids.forEach(function(id){ perm[id] = PDF_PERM[id].slice(); keep[id] = 1; });
    S = { order: PDF_ORDER.filter(function(id){ return keep[id]; }), perm: perm, ans: {}, pos: 0, mode: mode || "geral" };
    openJust = false; save(); render();
  }

  function stats(){
    var ok=0, bad=0;
    S.order.forEach(function(id){ var a=S.ans[id]; if (a===undefined) return; if (BANK[id].alternativas[a].ok) ok++; else bad++; });
    return {ok:ok, bad:bad, done:ok+bad};
  }

  function header(){
    var st = stats();
    document.getElementById("nOk").textContent = st.ok;
    document.getElementById("nBad").textContent = st.bad;
    document.getElementById("pct").textContent = st.done ? Math.round(100*st.ok/st.done)+"%" : "0%";
    document.getElementById("barFill").style.width = (100*st.done/S.order.length)+"%";
  }

  function render(){
    header();
    if (S.pos >= S.order.length) return renderEnd();
    var id = S.order[S.pos], q = BANK[id], perm = S.perm[id], ans = S.ans[id];
    var answered = ans !== undefined, right = answered && q.alternativas[ans].ok;
    if (answered && !right) openJust = true;
    var h = '<div class="meta"><span>Questão ' + (S.pos+1) + ' de ' + S.order.length + '</span>' +
      (S.mode==="erradas" ? '<span class="mode">Refazendo erradas · nº ' + PDF_NUM[id] + ' do PDF</span>' : '') + '</div>';
    h += '<section class="card"><p class="enun">' + esc(q.enunciado) + '</p><ul class="alts">';
    perm.forEach(function(oi, k){
      var a = q.alternativas[oi], cls = "";
      if (answered){ if (a.ok) cls="ok"; else if (oi===ans) cls="bad"; else cls="dim"; }
      h += '<li><button class="alt '+cls+'" data-oi="'+oi+'" '+(answered?'disabled':'')+'><span class="lt">'+LETRAS[k]+'</span><span class="tx">'+esc(a.t)+'</span></button></li>';
    });
    h += '</ul>';
    if (answered){
      h += '<div class="verdict">' + (right
        ? '<span class="v ok">Correto!</span><button class="btn" id="tgl">'+(openJust?'Ocultar justificativas':'Ver justificativas')+'</button>'
        : '<span class="v bad">Errou. Resposta: ' + LETRAS[perm.indexOf(q.alternativas.findIndex(function(a){return a.ok;}))] + '</span>') + '</div>';
      if (openJust){
        h += '<div class="just">';
        perm.forEach(function(oi, k){
          var a = q.alternativas[oi];
          h += '<div class="j '+(a.ok?'ok':'no')+'"><span class="lt">'+LETRAS[k]+'</span><p><span class="tag">'+(a.ok?'Correta':'Incorreta')+'</span>'+esc(a.porque.replace(/^Correta\.\s*/,''))+'</p></div>';
        });
        h += '<div class="tip"><b>Macete</b>' + esc(q.macete) + '</div></div>';
      }
    }
    h += '</section>';
    h += '<div class="nav"><button class="btn" id="prev" '+(S.pos===0?'disabled':'')+'>← Anterior</button>' +
         '<button class="btn primary" id="next">'+(S.pos===S.order.length-1?'Ver resultado':'Próxima →')+'</button></div>';
    h += tools();
    h += '<p class="hint">Atalhos: A a E (ou 1 a 5) responde, J abre justificativas, ← e → navegam.</p>';
    app.innerHTML = h;
    bind();
  }

  function tools(){
    if (pendingReset){
      var msg = pendingReset==="geral" ? "Começar um simulado novo com todas as questões? O progresso atual será apagado." : "Refazer só as questões erradas? O progresso atual será substituído.";
      return '<div class="confirm"><span>'+msg+'</span><button class="btn primary" id="yes">Confirmar</button><button class="btn" id="no">Cancelar</button></div>';
    }
    var nErr = S.order.filter(function(id){ var a=S.ans[id]; return a!==undefined && !BANK[id].alternativas[a].ok; }).length;
    return '<div class="tools"><button class="btn" id="rGeral">Novo simulado</button>' +
      '<button class="btn" id="rErr" '+(nErr?'':'disabled')+'>Refazer só as erradas ('+nErr+')</button>' +
      '<button class="btn" id="goEnd">Encerrar e ver nota</button></div>';
  }

  function renderEnd(){
    var st = stats();
    var temas = {};
    S.order.forEach(function(id){ var a=S.ans[id]; if (a===undefined) return; var t=BANK[id].tema; temas[t]=temas[t]||{ok:0,n:0}; temas[t].n++; if (BANK[id].alternativas[a].ok) temas[t].ok++; });
    var h = '<section class="card end"><h2>Resultado</h2><p class="empty">' + st.done + ' de ' + S.order.length + ' questões respondidas.</p>';
    h += '<div class="big">' + (st.done ? Math.round(100*st.ok/st.done) : 0) + '%</div>';
    h += '<p>' + st.ok + ' certas e ' + st.bad + ' erradas.</p><div class="rows">';
    Object.keys(temas).sort(function(a,b){ return temas[a].ok/temas[a].n - temas[b].ok/temas[b].n; }).forEach(function(t){
      var p = Math.round(100*temas[t].ok/temas[t].n);
      h += '<div class="row"><span>'+esc(t)+'</span><span class="track"><i style="width:'+p+'%"></i></span><span>'+temas[t].ok+'/'+temas[t].n+'</span></div>';
    });
    h += '</div><p class="empty">Temas ordenados do pior para o melhor desempenho.</p></section>';
    h += '<div class="nav"><button class="btn" id="back">← Voltar às questões</button></div>' + tools();
    app.innerHTML = h;
    bind();
  }

  function on(id, fn){ var el=document.getElementById(id); if (el) el.addEventListener("click", fn); }
  function bind(){
    app.querySelectorAll(".alt").forEach(function(b){ b.addEventListener("click", function(){ answer(+b.dataset.oi); }); });
    on("tgl", function(){ openJust=!openJust; render(); });
    on("prev", function(){ go(-1); });
    on("next", function(){ go(1); });
    on("back", function(){ S.pos = Math.max(0, S.order.length-1); for (var i=0;i<S.order.length;i++){ if (S.ans[S.order[i]]===undefined){ S.pos=i; break; } } save(); render(); });
    on("goEnd", function(){ S.pos = S.order.length; save(); render(); });
    on("rGeral", function(){ pendingReset="geral"; render(); });
    on("rErr", function(){ pendingReset="erradas"; render(); });
    on("no", function(){ pendingReset=null; render(); });
    on("yes", function(){
      var m = pendingReset; pendingReset=null;
      if (m==="geral") novo(ALL, "geral");
      else novo(S.order.filter(function(id){ var a=S.ans[id]; return a!==undefined && !BANK[id].alternativas[a].ok; }), "erradas");
    });
  }

  function answer(oi){
    var id = S.order[S.pos];
    if (S.ans[id] !== undefined) return;
    S.ans[id] = oi; openJust = !BANK[id].alternativas[oi].ok; save(); render();
  }
  function go(d){
    var np = S.pos + d; if (np < 0 || np > S.order.length) return;
    S.pos = np; openJust = false; pendingReset = null; save(); render(); window.scrollTo(0,0);
  }

  document.addEventListener("keydown", function(e){
    if (e.ctrlKey || e.metaKey || e.altKey || S.pos >= S.order.length) return;
    var k = e.key.toUpperCase(), idx = LETRAS.indexOf(k);
    if (idx < 0 && k >= "1" && k <= "5") idx = +k - 1;
    if (idx >= 0){ var id=S.order[S.pos]; if (S.ans[id]===undefined){ answer(S.perm[id][idx]); } return; }
    if (k === "J"){ var b=document.getElementById("tgl"); if (b) b.click(); }
    else if (e.key === "ArrowRight" || e.key === "Enter"){ if (S.ans[S.order[S.pos]]!==undefined){ e.preventDefault(); go(1); } }
    else if (e.key === "ArrowLeft"){ go(-1); }
  });

  S = load();
  if (S){ // descarta progresso salvo se o banco mudou
    S.order = S.order.filter(function(id){ return BANK[id]; });
    var missing = ALL.filter(function(id){ return !S.perm[id]; });
    if (!S.order.length || (S.mode==="geral" && missing.length)) S = null;
    else S.pos = Math.min(S.pos, S.order.length);
  }
  if (!S) novo(ALL, "geral"); else render();
})();
</script>

</html>
